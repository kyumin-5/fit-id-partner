name: FIT ID Partner CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: node --experimental-strip-types scripts/catalog-csv-smoke.mjs
      - run: node --experimental-strip-types scripts/product-photo-smoke.mjs
      - run: npx tsc --noEmit
      - run: npx next build
